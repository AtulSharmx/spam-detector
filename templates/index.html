<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SMS Spam Detector</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f13;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 14px;
      color: #888;
    }

    .badge {
      display: inline-block;
      background: #1e3a5f;
      color: #4dabf7;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      margin-top: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 8px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    textarea {
      width: 100%;
      background: #12121a;
      border: 1px solid #2a2a3a;
      border-radius: 10px;
      color: #e0e0e0;
      font-size: 15px;
      padding: 16px;
      resize: vertical;
      min-height: 130px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
      line-height: 1.5;
    }

    textarea:focus { border-color: #4dabf7; }

    .btn {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      background: linear-gradient(135deg, #1971c2, #1864ab);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.3px;
    }

    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .result {
      margin-top: 24px;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .result.spam {
      background: #2d1111;
      border: 1px solid #c92a2a;
    }

    .result.ham {
      background: #0f2d1a;
      border: 1px solid #2f9e44;
    }

    .result-icon { font-size: 42px; margin-bottom: 10px; }

    .result-label {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .result.spam .result-label { color: #ff6b6b; }
    .result.ham .result-label { color: #51cf66; }

    .result-sub {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 14px;
    }

    .confidence-bar {
      background: #0f0f13;
      border-radius: 20px;
      height: 8px;
      overflow: hidden;
      margin: 0 auto;
      max-width: 300px;
    }

    .confidence-fill {
      height: 100%;
      border-radius: 20px;
      transition: width 0.5s ease;
    }

    .result.spam .confidence-fill { background: linear-gradient(90deg, #c92a2a, #ff6b6b); }
    .result.ham .confidence-fill { background: linear-gradient(90deg, #2f9e44, #51cf66); }

    .confidence-text {
      margin-top: 8px;
      font-size: 13px;
      color: #888;
    }

    .stats {
      margin-top: 28px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .stat {
      background: #12121a;
      border: 1px solid #2a2a3a;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }

    .stat-val {
      font-size: 20px;
      font-weight: 700;
      color: #4dabf7;
    }

    .stat-label {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .clear-btn {
      background: none;
      border: none;
      color: #555;
      font-size: 12px;
      cursor: pointer;
      margin-top: 10px;
      text-decoration: underline;
    }

    .clear-btn:hover { color: #888; }

    @media (max-width: 480px) {
      .container { padding: 28px 18px; }
      .stats { gap: 8px; }
      .stat { padding: 12px 6px; }
      .stat-val { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="icon">📱</div>
      <h1>SMS Spam Detector</h1>
      <p>Powered by Machine Learning — Random Forest + TF-IDF</p>
      <span class="badge">AICTE · IBM SkillsBuild · ML Internship 2026</span>
    </div>

    <label for="msgInput">Enter a message to analyze</label>
    <textarea id="msgInput" placeholder="e.g. Congratulations! You've won a FREE iPhone. Click here to claim now..."></textarea>

    <button class="btn" id="analyzeBtn" onclick="analyze()">🔍 Analyze Message</button>

    <div class="result" id="result">
      <div class="result-icon" id="resultIcon"></div>
      <div class="result-label" id="resultLabel"></div>
      <div class="result-sub" id="resultSub"></div>
      <div class="confidence-bar">
        <div class="confidence-fill" id="confidenceFill" style="width:0%"></div>
      </div>
      <div class="confidence-text" id="confidenceText"></div>
      <button class="clear-btn" onclick="clearAll()">Clear & try another</button>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-val">98.57%</div>
        <div class="stat-label">Accuracy</div>
      </div>
      <div class="stat">
        <div class="stat-val">5,572</div>
        <div class="stat-label">Dataset Size</div>
      </div>
      <div class="stat">
        <div class="stat-val">Random Forest</div>
        <div class="stat-label">Algorithm</div>
      </div>
    </div>
  </div>

  <script>
    async function analyze() {
      const msg = document.getElementById('msgInput').value.trim();
      if (!msg) { alert('Please enter a message first.'); return; }

      const btn = document.getElementById('analyzeBtn');
      if (btn.disabled) return;
      btn.disabled = true;
      btn.textContent = 'Analyzing...';

      try {
        const res = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: msg })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `Server error (${res.status})`);

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        resultDiv.className = 'result ' + (data.is_spam ? 'spam' : 'ham');

        document.getElementById('resultIcon').textContent = data.is_spam ? '🚨' : '✅';
        document.getElementById('resultLabel').textContent = data.is_spam ? 'SPAM DETECTED' : 'SAFE MESSAGE';
        document.getElementById('resultSub').textContent = data.is_spam
          ? 'This message looks like spam. Be careful!'
          : 'This message appears to be legitimate.';

        document.getElementById('confidenceFill').style.width = data.confidence + '%';
        document.getElementById('confidenceText').textContent = `Confidence: ${data.confidence}%`;

      } catch (e) {
        alert(e instanceof TypeError ? 'Error analyzing message. Make sure the server is running.' : e.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '🔍 Analyze Message';
      }
    }

    function clearAll() {
      document.getElementById('msgInput').value = '';
      document.getElementById('result').style.display = 'none';
    }

    document.getElementById('msgInput').addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.key === 'Enter') analyze();
    });
  </script>
</body>
</html>
